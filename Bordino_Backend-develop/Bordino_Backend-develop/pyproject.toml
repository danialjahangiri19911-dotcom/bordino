[tool.poetry]
name = "bordino-backend"
version = "0.2.0"
description = "Bordino Backend - Django REST API"
authors = ["Pejman Ghafouri <pejman.ghafouri@mehrparsict.com>"]
readme = "README.md"
package-mode = false


[tool.poetry.dependencies]
python = "^3.10"
# Django 5.2 LTS - keeping at 5.2 for django-celery-beat compatibility (<6.0)
Django = "^5.2"
djangorestframework = "^3.16.1"
djangorestframework-simplejwt = "^5.5.1"
django-cors-headers = "^4.9.0"
django-environ = "^0.12.0"
psycopg2-binary = "^2.9.11"
Pillow = "^12.0.0"
celery = "^5.6.0"
redis = "^7.1.0"
django-redis = "^6.0.0"
requests = "^2.32.5"
django-filter = "^25.2"
django-celery-beat = "^2.8.1"
pydantic = "^2.12.5"
drf-spectacular = "^0.29.0"
gunicorn = "^23.0.0"
kavenegar = "^1.1.2"
django-import-export = "^4.3.14"
uvicorn = "^0.34.0"
sentry-sdk = "^2.48.0"
django-storages = "^1.14.4"
boto3 = "^1.35.0"
whitenoise = "^6.6.0"
django-silk = "^5.1"
hafez = "^0.4.2"
pandas = {version = ">=2.0.0", python = ">=3.11"}
pywebpush = "2.5.0"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.8.0"
ruff = "^0.9.0"
isort = "^5.13.0"
mypy = "^1.19.1"
pylint = "^4.0.4"

[tool.poetry.scripts]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "migrations",
    "venv",
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific rules
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

[tool.isort]
profile = "black"
line_length = 100
skip = ["migrations", ".venv", "venv"]
skip_glob = ["*/migrations/*"]
known_django = ["django", "rest_framework"]
known_first_party = ["apps", "main_app"]
sections = ["FUTURE", "STDLIB", "DJANGO", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
