apply plugin: 'com.android.application'

android {
    namespace "co.bordino.lottery"
    compileSdk rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    // Pushe manifest token (from console.pushe.co): pushe.properties → pushe_token=PUSHE_…
    // (BORDINO_PUSHE_PROPS points elsewhere, e.g. next to the signing key). Optional: without it
    // the app builds and runs, only without Android notifications.
    def pusheFile = file(System.getenv("BORDINO_PUSHE_PROPS") ?: "../pushe.properties")
    def pusheProps = new Properties()
    if (pusheFile.exists()) pusheFile.withInputStream { pusheProps.load(it) }
    def pusheToken = (pusheProps["pushe_token"] ?: "").toString().trim()
    defaultConfig {
        manifestPlaceholders = [pusheToken: pusheToken, pusheEnabled: pusheToken ? "true" : "false"]
        buildConfigField "boolean", "PUSHE_ENABLED", pusheToken ? "true" : "false"
        applicationId "co.bordino.lottery"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing: the key lives outside git (see Bordino_Mobile/README.md).
    def keystorePropsFile = file(System.getenv("BORDINO_KEYSTORE_PROPS") ?: "../keystore.properties")
    if (keystorePropsFile.exists()) {
        def keystoreProps = new Properties()
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
        signingConfigs {
            release {
                storeFile file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }
    // No key, no release: an unsigned APK cannot be installed or updated, so fail loudly instead.
    if (!keystorePropsFile.exists()) {
        gradle.taskGraph.whenReady { graph ->
            if (graph.allTasks.any { it.name.toLowerCase().contains("release") }) {
                throw new GradleException("Release signing key not found: ${keystorePropsFile} (see Bordino_Mobile/README.md)")
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropsFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Pushe (Iranian push service) — only what notifications need: no analytics/datalytics/sentry.
    implementation "co.pushe.plus:core:2.6.4"
    implementation "co.pushe.plus:fcm:2.6.4"
    implementation "co.pushe.plus:notification:2.6.4"
    // Adivery (rewarded video, docs.adivery.com) and the advertising id it targets with.
    implementation "com.adivery:sdk:4.9.0"
    implementation "com.google.android.gms:play-services-ads-identifier:18.0.1"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
